	nav{width:100%;background:antiquewhite;padding:10px;}
	nav a{color:#6a1b9a;text-decoration:none;font-size:28px;font-weight:bold;margin-right:10px;}
	nav a:hover{color:#8e24aa;}
	.container{width:80%;margin:auto;background:white;padding:20px;margin-top:20px;border-radius:10px;}
	.question{margin-bottom:20px;}

<body>

<nav>
	<h1>
		<a href="index.html"><i class="fa fa-home"></i> 首頁</a>
		<a href="aboutme.html"><i class="fa fa-question-circle"></i> 關於我</a>

        <i class="fa fa-bars" aria-hidden="true"></i>分類
        <i class="fa fa-sign-in" aria-hidden="true"></i>登入
    </h1>
</nav>

<div class="container">
<h1 class="w3-center">飲料店消費習慣問卷</h1>


<form>

<fieldset>

<legend>問卷內容</legend>

<!-- 1 -->

<div class="question">

<h3>1. 請勾選是否有購買手搖飲料的習慣。</h3>


<label>
<input type="checkbox" name="buydrink">是</label>
<input type="checkbox" name="buydrink">否</label>
</div>

<hr>

<!-- 2 -->

<div class="question">

<h3>2. 請選擇最常喝的甜度</h3>

<label><input type="radio" name="brand"> 全糖</label><br>
<label><input type="radio" name="brand"> 少糖</label><br>
<label><input type="radio" name="brand"> 半糖</label><br>
<label><input type="radio" name="brand"> 微糖</label><br>
<label><input type="radio" name="brand"> 無糖</label><br>
</div>

<hr>

<!-- 3 -->

<div class="question">

<h3>3. 請選擇您每週購買飲料的次數。</h3>

<select class="w3-select">

<option>請選擇</option>
<option>1次以下</option>
<option>2~3次</option>
<option>4~5次</option>
<option>6次以上</option>

</select>

</div>

<hr>

<!-- 4 -->

<div class="question">

<h3>4. 請勾選您選擇飲料店時重視的因素（可複選）</h3>

<label><input type="checkbox"> 價格</label><br>
<label><input type="checkbox"> 口味</label><br>
<label><input type="checkbox"> 品牌</label><br>
<label><input type="checkbox"> 店家優惠活動</label>

</div>

<hr>

<!-- 5 -->

<div class="question">
<h3>5. 請選擇您喜歡的飲料類型</h3>
 <select class="w3-select" name="option">
 <option value="" disabled selected></option>
  <option value="1">純茶類</option>
  <option value="2">果汁類</option>
  <option value="3">拿鐵類</option>
</select>

</div>
<hr>

<!-- 6 -->

<div class="question">

<h3>6.請輸入您最喜歡的品牌</h3>
<input type="text" class="w3-input w3-border" placeholder="例如：50嵐">

</div>

<hr>

<!-- 7 -->

<div class="question">
<h3>7. 能接受飲料的價格上限是多少</h3>
<input type="number" min="0" class="w3-input w3-border">
</div>

<hr>

<!-- 8 -->
<div class="question">
<h3>8. 請選擇最近一次購買飲料的日期</h3>
<input type="date"class="w3-input w3-border">
</div>

<hr>

<!-- 9 -->
<div class="question">
<h3>9. 請問最不喜歡的飲料店以及品項是什麼？</h3>
<textarea rows="5" class="w3-input w3-border"></textarea>
</div>

<br>

<div class="w3-center">
<button type="submit" class="w3-button w3-green w3-round-large">送出</button>
<button type="reset" class="w3-button w3-red w3-round-large">重設</button>
</div>

</fieldset>
</form>
</div>
</body>
</html>
